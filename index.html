<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Decides | Securityplus Federal Credit Union</title>

    <!-- Securityplus brand typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Luckiest Guy for the top-bar game title (2026-09-23, per Kayla). -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div id="game">

    <!-- ================= TOP BAR ================= -->

    <div id="topBar">

        <div id="topBarLeft"></div>

        <div id="gameTitle">Driver Decides</div>

        <div id="topBarRight">
            <button id="resetButton" class="iconButton" type="button" aria-label="Restart">
                <svg class="reset-icon" viewBox="0 0 159.96 159.68" aria-hidden="true">
                    <path d="M125.32,26.76C95.65,1.7,52.69,5.35,27.33,34.19c-21.87,24.87-23.31,61.46-2.78,87.95,13.93,17.98,35.56,28.66,58.69,27.5,26.47-1.33,49.6-17.28,60.77-41.29l9.02,4c-13.16,28.84-42.03,47.62-73.83,47.32-24.66-.24-47.44-12.11-62.44-31.37C-1.06,105.46-5.06,74.83,6.64,48.33,18.38,21.75,43.54,3.07,72.72.41c23.8-2.17,47.42,6.05,63.87,23.13l13.4,13.91V0s9.97.02,9.97.02v54.9s-54.93,0-54.93,0l-.02-9.97,38.3-.04c-6.07-6.32-11.63-12.78-17.97-18.14Z"/>
                </svg>
            </button>
        </div>

    </div>


    <!-- ================= HUD =================
         Rebuilt for the needs-vs-wants sorting rework (2026-09-10): the
         wallet/purchases stats are gone (no money math in this version at
         all) - just how many you've sorted right, and the round's goal. -->

    <div id="hud">

        <div class="starsBox" id="starsBox">
            <span class="statLabel">
                <svg class="mini-icon" viewBox="0 0 159.84 138.36" aria-hidden="true">
                    <path d="M57.87,136.07c-20.64,4.62-38.84,2.03-57.87-5.74V8.06s10.98,4.22,10.98,4.22c16.62,6.39,34.41,6.4,51.59,1.77l18.7-5.79c7.47-2.31,14.6-4.54,22.23-6.3,19.83-4.1,37.78-1.61,56.33,6.01v122.38c-20.16-9.11-39.02-11.73-60.24-6.79l-21.49,6.55-20.24,5.97ZM63.19,124.37l24.79-7.93c10.53-3.17,21.05-5.07,31.89-5.46,1.74-15.42,14.69-26.9,30.01-26.8l-.02-45.03c-16.49-.23-29.59-13.04-30.01-29.2-8.11.12-15.45,1.78-23.02,3.87l-26.86,8.61c-9.91,3.04-19.76,4.54-30.4,4.85-1.46,15.26-14.32,26.86-29.62,26.83v45.01c16.51.28,29.55,13.24,29.91,29.36,7.9-.44,15.4-1.82,23.32-4.1ZM149.87,14.69c-6.81-2.21-13.15-3.52-20.07-4.4.93,10.61,9.17,18.64,20.06,18.82v-14.42ZM29.81,26.62c-7.16-.8-13.16-2.05-19.84-4.02v21.51c10.33-.06,18.76-7.54,19.84-17.48ZM149.87,115.72v-21.55c-10.41,0-18.51,7.51-19.7,17.46,6.7.77,12.9,2.06,19.7,4.09ZM29.91,127.82c-1.16-11.06-9.43-18.43-19.93-18.68l.03,14.45c6.77,2.18,13.11,3.6,19.9,4.23Z"/>
                    <path d="M103.24,87.67c-5.21,11.34-17.12,19.1-29.16,15.61-7.57-2.2-13.53-7.43-17.07-14.51-7.85-15.73-5.78-36.67,7.3-48.46,8.15-7.34,19.64-8.27,28.62-1.91,14.96,10.59,17.95,32.64,10.31,49.27ZM88.8,90.43c10.79-9.91,11.26-29.48,1.87-40.72-2.79-3.33-6.31-5.4-10.28-5.53-4.19-.13-7.86,1.72-10.78,4.91-9.63,10.55-9.57,29.32-.05,40.02,5.18,5.82,13.26,6.8,19.24,1.31Z"/>
                </svg>
                Dollars
            </span>
            <span class="statValue" id="starsValue">$0.00</span>
        </div>

    </div>

    <!-- A few colorful stars burst off the scooter on a correct catch and
         fly up into the dollars card - a top-level layer (sibling of
         #roadScene/#hud, not nested in either) so the flight can cross
         from one to the other and still stack above both, since a child
         can never paint above its own parent's stacking context. -->
    <div id="starFlightLayer" aria-hidden="true"></div>


    <!-- ================= ROAD SCENE =================
         Rebuilt again (2026-09-10, drag rework): NEED and WANT are now the
         things rolling continuously down the road, one per lane - pure
         driving/lane signage, not the question itself. The actual question
         is the item word in the fixed #itemPopup at top center, which never
         moves. The scooter is drag-steered left/right by the player; where
         it sits when the timer runs out is the answer. -->

    <div id="roadScene">

        <!-- ============ LAYERED BACKGROUND (2026-09-16 art breakdown) ============
             Kayla split the old single flat Background.svg into separate
             pieces so the scene can actually move: sky and hills are the
             distant horizon and stay put; the grass beside the road scrolls
             continuously (groundScrollLayer, below) to sell forward motion;
             the road itself is a separate static image on top of the
             scrolling grass, with NO baked-in center line - the dashed line
             is still purely JS/CSS (roadStripeLayer), so it's the only
             moving part of the road surface. See AMBIENT BACKGROUND MOTION
             in game.js for how the grass/flowers/dashes/trees all animate. -->

        <img id="skyImage" class="bg-layer bg-layer--sky" src="images/Sky.svg" alt="">
        <img id="hillsImage" class="bg-layer bg-layer--hills" src="images/hills.svg" alt="">

        <!-- Scrolling ground: just Kayla's two grass tiles (light + dark),
             stacked and looped with a modulo scroll offset in JS - a tile
             that scrolls fully past the bottom reappears at the top, right
             under the hills, with no gap or seam. Purely ambient, same as
             the sun/clouds - runs forever from page load. -->
        <div id="groundScrollLayer" aria-hidden="true"></div>

        <img id="roadImage" class="bg-layer bg-layer--road" src="images/road.svg" alt="">

        <!-- Forward-motion road markings (2026-09-16 perspective pass):
             dashes spawn small at the hill crest and travel straight down
             the center line - same road-perspective easing as the NEED/WANT
             signs - to sell "the road is moving toward you" instead of the
             signs looking like they're flying at the player. Populated and
             animated entirely from JS - see the AMBIENT BACKGROUND MOTION
             section in game.js. Empty on load; fills in immediately. -->
        <div id="roadStripeLayer" aria-hidden="true"></div>

        <!-- Purely decorative sky - a sun that pulses gently in the top
             right, and two clouds that drift slowly across from one side
             to the other on their own independent loops. -->
        <div id="skyLayer" aria-hidden="true">
            <img class="sunDecor" src="images/sun.svg" alt="">
            <img class="cloudDecor cloudDecor--1" src="images/cloud1.svg" alt="" style="top:9%; width:13%; animation-duration:48s; animation-delay:-6s;">
            <img class="cloudDecor cloudDecor--2" src="images/cloud2.svg" alt="" style="top:19%; width:9%; animation-duration:62s; animation-delay:-34s;">
        </div>

        <!-- Roadside ambient scenery - trees, flowers/grass patches, and
             the occasional billboard/credit union branch landmark - all
             share this ONE layer (2026-09-21 depth-stacking fix). Each
             piece still eases down the same perspective travel curve (see
             AMBIENT BACKGROUND MOTION in game.js) and still gets its own
             z-index set every frame from how far along its trip it is, but
             that only sorts correctly against everything else if they're
             all siblings under the same parent - three separate layer divs
             (the original setup) each become their own stacking context,
             so a whole layer added later in the DOM paints over an earlier
             one's contents wholesale regardless of each piece's individual
             depth, which is exactly what caused a small, distant tree to
             render in front of a big, close landmark that was supposedly
             behind it. One shared layer means one shared stacking order,
             so depth always wins correctly no matter which spawner planted
             which piece. Populated entirely from JS; empty on load. -->
        <div id="ambientLayer" aria-hidden="true"></div>

        <!-- NEED and WANT travel down together each item, but which side
             each lands on is randomized per item (2026-09-16 difficulty
             bump) - so the player can't just memorize "need is always
             left" and has to actually read the word each time. -->
        <div id="roadSignsLayer">
            <div id="roadSignNeed" class="roadSign roadSign--need">NEED</div>
            <div id="roadSignWant" class="roadSign roadSign--want">WANT</div>
        </div>

        <!-- Invisible tap targets - a kid can also tap a side instead of
             dragging the scooter there. These are just the physical
             left/right halves of the road; which one currently means
             need vs. want is decided in JS per item, not fixed here. -->
        <div class="laneZone laneZone--left" data-lane="left"></div>
        <div class="laneZone laneZone--right" data-lane="right"></div>

        <!-- The word (plus a little picture) for whatever's being sorted
             right now. Fixed in place - it never travels down the road. -->
        <div id="itemPopup" class="itemPopup">
            <img id="itemPopupIcon" class="itemPopupIcon" alt="" />
            <span id="itemPopupText" class="itemPopupText"></span>
        </div>

        <!-- Toasts + sparkles for correct/incorrect feedback. -->
        <div id="feedbackLayer"></div>

        <div id="scooter">
            <img class="scooter-img" src="images/scooter-child.svg" alt="">
        </div>

    </div>


    <!-- ================= START SCREEN ================= -->

    <div id="startScreen">

        <div class="startCard">

            <div class="start-badge-wrap">

                <!-- Kayla's colorful star artwork (matching Lemonade
                     Stand's start popup / the in-game catch-sparkle
                     burst), replacing the old flat single-color glyph.
                     Colors are baked into the SVG paths themselves, not
                     recolored via CSS. -->
                <div class="start-sparkle start-sparkle--a">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186.93 186.94" aria-hidden="true"><g><path d="M186.93,93.47l-48.54,21.97c-10.19,4.61-18.35,12.77-22.96,22.96l-21.97,48.54-10.11-22.35-6.69-14.78-5.16-11.41c-4.61-10.19-12.77-18.35-22.96-22.96l-15.24-6.9L0,93.47l48.54-21.96c10.19-4.61,18.35-12.77,22.96-22.96L93.46,0l18.61,41.13,3.36,7.42c4.28,9.46,11.62,17.17,20.81,21.91.7.37,1.42.72,2.15,1.05l21.29,9.63,27.25,12.33Z" fill="#258BFF"/><path d="M186.93,93.47l-48.54,21.97c-10.19,4.61-18.35,12.77-22.96,22.96l-21.97,48.54-10.11-22.35c24.69-47.1,54.91-71.32,76.33-83.45l27.25,12.33Z" fill="#001d3a" opacity=".05"/><path d="M112.07,41.13c-11.02,2.31-28.89,10.68-41.3,39.56-6.68,15.55-23.67,23.69-37.47,27.85L0,93.47l48.54-21.96c10.19-4.61,18.35-12.77,22.96-22.96L93.46,0l18.61,41.13Z" fill="#fff" opacity=".3"/></g></svg>
                </div>

                <div class="start-sparkle start-sparkle--b">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95.71 95.72" aria-hidden="true"><g><path d="M95.71,47.86l-20.85,5.32c-10.65,2.72-18.96,11.04-21.68,21.68l-5.33,20.86-5.32-20.86c-.24-.92-.51-1.83-.83-2.71-1.98-5.5-5.49-10.25-10.04-13.73-3.16-2.42-6.82-4.22-10.81-5.24L0,47.86l20.85-5.33c10.64-2.72,18.96-11.03,21.68-21.68L47.85,0l5.33,20.85c.48,1.87,1.13,3.68,1.94,5.39,3.38,7.16,9.48,12.74,17,15.45.89.32,1.81.6,2.74.84l20.85,5.33Z" fill="#FFF025"/><path d="M95.71,47.86l-20.85,5.32c-10.65,2.72-18.96,11.04-21.68,21.68l-5.33,20.86-5.32-20.86c-.24-.92-.51-1.83-.83-2.71,10.93-15.61,22.05-24.99,30.42-30.46.89.32,1.81.6,2.74.84l20.85,5.33Z" fill="#001d3a" opacity=".05"/><path d="M55.12,26.24c-7.265,2.09-12.868,7.753-13.42,15.45-.53,7.392-3.983,13.937-10.04,16.73-3.16-2.42-6.82-4.22-10.81-5.24L0,47.86l20.85-5.33c10.64-2.72,18.96-11.03,21.68-21.68L47.85,0l5.33,20.85c.48,1.87,1.13,3.68,1.94,5.39Z" fill="#fff" opacity=".3"/></g></svg>
                </div>

                <div class="start-badge">
                    <svg class="start-badge-icon" viewBox="0 0 159.8 139.7" aria-hidden="true">
                        <path d="M25.211,89.905c12,.241,21.621,8.435,24.347,19.887l61.013-.005c1.603-8.208,6.944-14.734,14.737-18.112L105.815,9.987l-25.841-.005.01-9.982,34,.003,21.153,89.834c11.188.041,20.54,7.586,23.541,17.458,3.36,11.052-1.068,22.286-10.13,28.299-9.443,6.265-21.983,5.245-30.354-2.295-4.046-3.644-6.567-8.075-7.653-13.523l-61.028-.015c-2.794,12.853-14.821,21.408-27.771,19.729S-.936,126.109.072,113.05c.997-12.926,11.796-23.414,25.139-23.145ZM39.942,114.77c0-8.276-6.716-14.985-15-14.985s-15,6.709-15,14.985,6.716,14.985,15,14.985,15-6.709,15-14.985ZM149.842,114.77c0-8.276-6.716-14.985-15-14.985s-15,6.709-15,14.985,6.716,14.985,15,14.985,15-6.709,15-14.985Z"/>
                    </svg>
                </div>

            </div>

            <h1>Driver Decides</h1>

            <p class="introLead">
                A sign will pop up with everyday items.<br>Drag your scooter into the NEED lane or<br>the WANT lane to sort them!
            </p>

            <div class="startActions">

                <button
                    id="startButton"
                    class="brandButton"
                    type="button">
                    Start
                </button>

                <button
                    id="tutorialButton"
                    class="brandButton brandButton--secondary"
                    type="button">
                    Tutorial
                </button>

            </div>

        </div>

    </div>


    <!-- ================= TUTORIAL =================
         A short, two-step walkthrough before the first real (scored)
         round (2026-09-16 spotlight rework): step 1 sits on the right,
         spotlighting the item popup, while the NEED/WANT signs travel
         partway down the road on their own; step 2 sits on the left,
         spotlighting those signs once they've paused mid-travel. Then
         the signs resume and the player gets one live practice catch
         before the real game begins. Skippable any time via "Skip
         tutorial", same pattern as Kayla's other games' tutorials. -->

    <div id="tutorialScreen">

        <div id="tutorialSpotlight"></div>

        <div id="tutorialCard" class="tutorialCard">

            <div class="tutorialHeader">
                <h2 id="tutorialTitle" class="tutorialTitle"></h2>

                <button id="tutorialSkipButton" class="tutorialSkip" type="button">
                    Skip tutorial
                    <svg class="tutorialSkip-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <p id="tutorialBody" class="tutorialBody"></p>

            <button id="tutorialNextButton" class="brandButton" type="button">
                Next
            </button>

        </div>

    </div>


    <!-- ================= FINISH ================= -->

        <div class="finishCard">

            <div class="results-sparkles">

                </svg>
            </div>

            <!-- White trophy replaces the old scooter circle badge (2026-09-23, per Kayla). -->
            <svg class="trophy-icon finish-trophy-top trophy-top" viewBox="0 0 159.86 159.76" aria-hidden="true">
                    <path d="M119.85,159.76H40.03s-.03-9.99-.03-9.99h34.97s-.02-30.9-.02-30.9c-4.8-1.37-8.61-3.59-12.32-6.47-5.47-4.56-9.88-9.77-13.52-15.96-11.04-3.14-20.94-8.3-29.19-16.24C3.84,64.03-.64,42.43.07,19.96l30.45.02L29.99,0h99.86s-.27,19.97-.27,19.97h30.29c.01,7.7-.33,14.98-1.57,22.53-2.37,12.85-7.52,24.59-16.24,34.3-8.55,8.87-18.97,14.87-30.7,18.69-4.39,7.7-10.02,14.26-17.3,19.17-2.93,1.76-5.66,3.13-9.12,4.16l-.02,30.95h34.97s-.03,9.98-.03,9.98ZM109.01,77.22c7.76-21.71,9.98-44.26,10.86-67.23H39.93c.91,24.69,3.45,50,13.07,72.56,3.57,7.43,7.27,14.48,13.55,19.98,3.59,3.15,8.58,7.2,13.54,6.95,14.28-2.31,23.97-19.19,28.94-32.26ZM35.89,61.91c-2.33-10.81-3.82-21.09-4.68-31.96H9.99c.44,8.89,1.98,17.7,5.62,26.11,5.25,12.44,14.86,22,27.13,27.65-2.83-7.06-4.93-14.04-6.84-21.8ZM149.87,29.96h-21.3c-.88,10.65-2.34,20.78-4.52,31.17-1.75,7.34-3.81,14.11-6.35,21.24,21.75-10.9,30.58-28.63,32.17-52.4Z"/>
                    <path d="M79.87,69.31l-19.87,10.16,3.98-21.78-16.06-15.53,22.05-3.51,9.92-19.76,9.9,19.77,22.09,3.48-15.75,15.6,3.63,21.83-19.89-10.27ZM79.81,58.11l6.52,3.27-1.14-7.44,5.42-4.91-7.26-1.28-3.52-6.33-3.22,6.35-7.47,1.25,5.42,4.95-1.18,7.45,6.42-3.31Z"/>
                </svg>

            <h1 id="finishTitle">
                <span id="finishTitleText">Great Job!</span>
            </h1>

            <div id="roundLabel" class="round-label"></div>

            <p id="finishSummary" class="results-message"></p>

            <div id="sortBreakdown" class="stat-row">
                <div class="stat-block">
                    <div id="statCorrectNumber" class="stat-number">0</div>
                    <div class="stat-label">correct</div>
                </div>
                <div class="stat-block">
                    <div id="statMissedNumber" class="stat-number">0</div>
                    <div class="stat-label">missed</div>
                </div>
            </div>

            <button
                id="playAgainButton"
                class="brandButton brandButton--onDark"
                type="button">
                <span id="playAgainLabel">Start</span>
            </button>

        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
