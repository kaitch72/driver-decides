<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Decides | Securityplus Federal Credit Union</title>

    <!-- Securityplus brand typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div id="game">

    <!-- ================= TOP BAR ================= -->

    <div id="topBar">

        <div id="topBarLeft"></div>

        <div id="gameTitle">Driver Decides</div>

        <div id="topBarRight">
            <button id="resetButton" class="iconButton" type="button" aria-label="Restart">
                <svg class="reset-icon" viewBox="0 0 159.96 159.68" aria-hidden="true">
                    <path d="M125.32,26.76C95.65,1.7,52.69,5.35,27.33,34.19c-21.87,24.87-23.31,61.46-2.78,87.95,13.93,17.98,35.56,28.66,58.69,27.5,26.47-1.33,49.6-17.28,60.77-41.29l9.02,4c-13.16,28.84-42.03,47.62-73.83,47.32-24.66-.24-47.44-12.11-62.44-31.37C-1.06,105.46-5.06,74.83,6.64,48.33,18.38,21.75,43.54,3.07,72.72.41c23.8-2.17,47.42,6.05,63.87,23.13l13.4,13.91V0s9.97.02,9.97.02v54.9s-54.93,0-54.93,0l-.02-9.97,38.3-.04c-6.07-6.32-11.63-12.78-17.97-18.14Z"/>
                </svg>
            </button>
        </div>

    </div>


    <!-- ================= HUD =================
         Rebuilt for the needs-vs-wants sorting rework (2026-09-10): the
         wallet/purchases stats are gone (no money math in this version at
         all) - just how many you've sorted right, and the round's goal. -->

    <div id="hud">

        <div class="starsBox">
            <span class="statLabel">
                <svg class="mini-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="11"/>
                    <text x="12" y="16.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" style="fill: var(--white);">$</text>
                </svg>
                Dollars
            </span>
            <span class="statValue" id="starsValue">$0.00</span>
        </div>

    </div>


    <!-- ================= ROAD SCENE =================
         Rebuilt again (2026-09-10, drag rework): NEED and WANT are now the
         things rolling continuously down the road, one per lane - pure
         driving/lane signage, not the question itself. The actual question
         is the item word in the fixed #itemPopup at top center, which never
         moves. The scooter is drag-steered left/right by the player; where
         it sits when the timer runs out is the answer. -->

    <div id="roadScene">

        <img id="bgImage" class="bg-image" src="images/Background.svg" alt="">

        <!-- Purely decorative sky - a sun that pulses gently in the top
             right, and two clouds that drift slowly across from one side
             to the other on their own independent loops. -->
        <div id="skyLayer" aria-hidden="true">
            <img class="sunDecor" src="images/sun.svg" alt="">
            <img class="cloudDecor cloudDecor--1" src="images/cloud1.svg" alt="" style="top:9%; width:13%; animation-duration:48s; animation-delay:-6s;">
            <img class="cloudDecor cloudDecor--2" src="images/cloud2.svg" alt="" style="top:19%; width:9%; animation-duration:62s; animation-delay:-34s;">
        </div>

        <!-- Purely decorative trees along the grass, gently swaying in a
             breeze. Four, at different depths/sides to match the road's
             perspective: small ones far back on both the left and right,
             a medium one at mid-distance on the right, and a large one up
             front on the left. -->
        <div id="treeLayer" aria-hidden="true">
            <div class="treeSpot" style="left:15%; top:42%; width:6%;">
                <img class="treeDecor" src="images/tree.svg" alt="" style="animation-duration:3.6s; animation-delay:0s;">
            </div>
            <div class="treeSpot" style="left:85%; top:42%; width:6%;">
                <img class="treeDecor" src="images/tree.svg" alt="" style="animation-duration:3.8s; animation-delay:0.3s;">
            </div>
            <div class="treeSpot" style="left:92%; top:60%; width:9%;">
                <img class="treeDecor" src="images/tree.svg" alt="" style="animation-duration:4.0s; animation-delay:0.9s;">
            </div>
            <div class="treeSpot" style="left:3%; top:80%; width:13%;">
                <img class="treeDecor" src="images/tree.svg" alt="" style="animation-duration:3.9s; animation-delay:1.1s;">
            </div>
        </div>

        <!-- Purely decorative lane signage, looping continuously down each
             lane the whole round - always NEED on the left, WANT on the
             right, so the player always knows which side is which. -->
        <div id="roadSignsLayer">
            <div id="roadSignNeed" class="roadSign roadSign--need">NEED</div>
            <div id="roadSignWant" class="roadSign roadSign--want">WANT</div>
        </div>

        <!-- Invisible tap targets - a kid can also tap a side instead of
             dragging the scooter there. -->
        <div class="laneZone laneZone--need" data-lane="need"></div>
        <div class="laneZone laneZone--want" data-lane="want"></div>

        <!-- The word for whatever's being sorted right now. Fixed in
             place - it never travels down the road. -->
        <div id="itemPopup" class="itemPopup"></div>

        <!-- Toasts + sparkles for correct/incorrect feedback. -->
        <div id="feedbackLayer"></div>

        <div id="scooter">
            <img class="scooter-img" src="images/scooter.svg" alt="">
        </div>

    </div>


    <!-- ================= START SCREEN ================= -->

    <div id="startScreen">

        <div class="startCard">

            <div class="start-badge-wrap">

                <div class="start-sparkle start-sparkle--a">
                    <svg viewBox="0 0 179.8 170" aria-hidden="true">
                        <polygon points="159.82 49.96 149.85 50 149.86 30 129.88 30 129.88 19.99 149.86 20 149.85 0 159.82 0 159.82 20 179.79 19.99 179.8 30 159.82 29.99 159.82 49.96"/>
                        <polygon points="149.83 169.96 139.86 170 139.87 150 119.89 150 119.89 139.99 139.87 140 139.86 120 149.83 120 149.82 140 169.8 139.99 169.8 150 149.83 149.99 149.83 169.96"/>
                        <path d="M64.87,149.82l-20.03-44.88L0,84.99l44.96-20.07,19.91-44.96,20.01,45.1,44.86,19.96-44.93,20-19.93,44.81ZM64.88,125.25l12.55-27.81,27.77-12.46-27.88-12.52-12.45-27.71-12.55,27.76-27.72,12.49,27.75,12.48,12.53,27.76Z"/>

                    </svg>
                </div>

                <div class="start-badge">
                    <svg class="start-badge-icon" viewBox="0 0 159.8 139.7" aria-hidden="true">
                        <path d="M25.211,89.905c12,.241,21.621,8.435,24.347,19.887l61.013-.005c1.603-8.208,6.944-14.734,14.737-18.112L105.815,9.987l-25.841-.005.01-9.982,34,.003,21.153,89.834c11.188.041,20.54,7.586,23.541,17.458,3.36,11.052-1.068,22.286-10.13,28.299-9.443,6.265-21.983,5.245-30.354-2.295-4.046-3.644-6.567-8.075-7.653-13.523l-61.028-.015c-2.794,12.853-14.821,21.408-27.771,19.729S-.936,126.109.072,113.05c.997-12.926,11.796-23.414,25.139-23.145ZM39.942,114.77c0-8.276-6.716-14.985-15-14.985s-15,6.709-15,14.985,6.716,14.985,15,14.985,15-6.709,15-14.985ZM149.842,114.77c0-8.276-6.716-14.985-15-14.985s-15,6.709-15,14.985,6.716,14.985,15,14.985,15-6.709,15-14.985Z"/>
                    </svg>
                </div>

            </div>

            <h1>Driver Decides</h1>

            <p class="introLead">
                A word will pop up for something people buy. Drag your scooter into the NEED lane or the WANT lane before time runs out!
            </p>

            <button
                id="startButton"
                class="brandButton"
                type="button">
                Start
            </button>

        </div>

    </div>


    <!-- ================= FINISH ================= -->

    <div id="finishScreen">

        <div class="finishCard">

            <div class="results-sparkles">

                    <polygon points="149.83 169.96 139.86 170 139.87 150 119.89 150 119.89 139.99 139.87 140 139.86 120 149.83 120 149.82 140 169.8 139.99 169.8 150 149.83 149.99 149.83 169.96"/>
                    <path d="M64.87,149.82l-20.03-44.88L0,84.99l44.96-20.07,19.91-44.96,20.01,45.1,44.86,19.96-44.93,20-19.93,44.81ZM64.88,125.25l12.55-27.81,27.77-12.46-27.88-12.52-12.45-27.71-12.55,27.76-27.72,12.49,27.75,12.48,12.53,27.76Z"/>
                </svg>
                <svg class="sparkle-icon" viewBox="0 0 179.8 170" aria-hidden="true">

            </div>

            <div class="finish-badge-wrap">
                <div class="finish-badge">
                    <svg class="finish-badge-icon" viewBox="0 0 159.8 139.7" aria-hidden="true">
                        <path d="M25.211,89.905c12,.241,21.621,8.435,24.347,19.887l61.013-.005c1.603-8.208,6.944-14.734,14.737-18.112L105.815,9.987l-25.841-.005.01-9.982,34,.003,21.153,89.834c11.188.041,20.54,7.586,23.541,17.458,3.36,11.052-1.068,22.286-10.13,28.299-9.443,6.265-21.983,5.245-30.354-2.295-4.046-3.644-6.567-8.075-7.653-13.523l-61.028-.015c-2.794,12.853-14.821,21.408-27.771,19.729S-.936,126.109.072,113.05c.997-12.926,11.796-23.414,25.139-23.145ZM39.942,114.77c0-8.276-6.716-14.985-15-14.985s-15,6.709-15,14.985,6.716,14.985,15,14.985,15-6.709,15-14.985ZM149.842,114.77c0-8.276-6.716-14.985-15-14.985s-15,6.709-15,14.985,6.716,14.985,15,14.985,15-6.709,15-14.985Z"/>
                    </svg>
                </div>
            </div>

            <h1 id="finishTitle">
                <svg class="trophy-icon" viewBox="0 0 159.86 159.76" aria-hidden="true">
                    <path d="M119.85,159.76H40.03s-.03-9.99-.03-9.99h34.97s-.02-30.9-.02-30.9c-4.8-1.37-8.61-3.59-12.32-6.47-5.47-4.56-9.88-9.77-13.52-15.96-11.04-3.14-20.94-8.3-29.19-16.24C3.84,64.03-.64,42.43.07,19.96l30.45.02L29.99,0h99.86s-.27,19.97-.27,19.97h30.29c.01,7.7-.33,14.98-1.57,22.53-2.37,12.85-7.52,24.59-16.24,34.3-8.55,8.87-18.97,14.87-30.7,18.69-4.39,7.7-10.02,14.26-17.3,19.17-2.93,1.76-5.66,3.13-9.12,4.16l-.02,30.95h34.97s-.03,9.98-.03,9.98ZM109.01,77.22c7.76-21.71,9.98-44.26,10.86-67.23H39.93c.91,24.69,3.45,50,13.07,72.56,3.57,7.43,7.27,14.48,13.55,19.98,3.59,3.15,8.58,7.2,13.54,6.95,14.28-2.31,23.97-19.19,28.94-32.26ZM35.89,61.91c-2.33-10.81-3.82-21.09-4.68-31.96H9.99c.44,8.89,1.98,17.7,5.62,26.11,5.25,12.44,14.86,22,27.13,27.65-2.83-7.06-4.93-14.04-6.84-21.8ZM149.87,29.96h-21.3c-.88,10.65-2.34,20.78-4.52,31.17-1.75,7.34-3.81,14.11-6.35,21.24,21.75-10.9,30.58-28.63,32.17-52.4Z"/>

            </h1>

            <div id="roundLabel" class="round-label"></div>

            <p id="finishSummary" class="results-message"></p>

            <div id="sortBreakdown" class="stat-row">
                <div class="stat-block">
                    <div id="statCorrectNumber" class="stat-number">0</div>
                    <div class="stat-label">correct</div>
                </div>
                <div class="stat-block">
                    <div id="statMissedNumber" class="stat-number">0</div>
                    <div class="stat-label">missed</div>
                </div>
            </div>

            <button
                id="playAgainButton"
                class="brandButton brandButton--onDark"
                type="button">

                </svg>
                <span id="playAgainLabel">Start</span>
            </button>

        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
